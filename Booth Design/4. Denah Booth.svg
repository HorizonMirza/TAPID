xt x="268" y="240" fill="#3F281F" font-family="Arial,sans-serif" font-size="3.1" font-weight="400" text-anchor="start">Logo dan tagline memakai standar final TAP ID.</text><text x="268" y="248" fill="#3F281F" font-family="Arial,sans-serif" font-size="3.1" font-weight="400" text-anchor="start">Render3D adalah ilustrasi; angka denah acuan layout.</text><text x="268" y="256" fill="#3F281F" font-family="Arial,sans-serif" font-size="3.1" font-weight="400" text-anchor="start">Vendor menetapkan rangka, pengaku, beban,</text><text x="268" y="262" fill="#3F281F" font-family="Arial,sans-serif" font-size="3.1" font-weight="400" text-anchor="start">kelistrikan dan detail pasang sesuai venue.</text><text x="15" y="289" fill="#3F281F" font-family="Arial,sans-serif" font-size="3.2" font-weight="400" text-anchor="start">B01 / Konsep awal untuk dipilih. Belum merupakan gambar fabrikasi atau perhitungan struktur.</text></svg>